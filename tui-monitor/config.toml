# FastAdHunter TUI monitor.
#
# Only host/port/token are required; every other key below is shown at its
# compiled-in default and can be deleted. The token may instead come from
# $FAH_TOKEN, which overrides this file.

host = "172.17.0.2"
port = 8443
token = "f4b804cc87c7ddba15ee996628cd780862927a3afbcd3aa58836d8c94c4055ca"

# The appliance's certificate is generated at first boot and trusted by no
# root store.
accept_invalid_certs = true

# How often each source is asked, in seconds.
[poll]
telemetry_seconds = 60
history_seconds = 60
# The appliance persists a perf sample every 60 s; re-reading the series is the
# only thing that advances the header's RSS graph.
rss_history_seconds = 300
routeros_seconds = 60

# How long a request may take before it counts as unreachable, in seconds.
[timeout]
telemetry_seconds = 5
history_seconds = 15
routeros_seconds = 2
reconnect_seconds = 2
# Silence on the events socket that counts as a dead connection. The server
# pushes stats every ~2 s, so this is ~15 missed pushes.
events_idle_seconds = 30

[ui]
feed_rows = 200
# Samples kept — 24 h at the appliance's 60 s perf cadence. A memory bound: the
# series arrives undecimated and the chart reduces it to the terminal's width.
rss_points = 1440
redraw_millis = 250
# Where the RSS graph changes colour. Applied per column, so the chart shows
# when memory crossed a threshold, not only where it sits now.
rss_warn_mb = 60
rss_alert_mb = 100
slow_query_ms = 50.0

# Read-only. Omit base_url to drop the router figures from the footer.
[routeros]
base_url = "https://192.168.10.1:8443/rest"
user = "monitor"
# password = "…"   # falls back to $MP
container = "fastadhunter"
