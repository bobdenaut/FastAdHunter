# FastAdHunter TUI monitor — example configuration.
#
# Copy to `config.toml` beside this file (git-ignored: it holds the live bearer
# token) and replace every PASTE-… placeholder. Only host/port/token are
# required; every other key below is shown at its compiled-in default and can
# be deleted. The token may instead come from $FAH_TOKEN, which overrides this
# file.

host = "172.17.0.2"
port = 8443
token = "PASTE-API-KEY-HERE"

# The appliance's certificate is generated at first boot and trusted by no
# root store.
accept_invalid_certs = true

# How often each source is asked, in seconds.
[poll]
telemetry_seconds = 60
history_seconds = 60
# The appliance persists a perf sample every 60 s; re-reading the series is the
# only thing that advances the header's RSS graph.
rss_history_seconds = 300
routeros_seconds = 60

# How long a request may take before it counts as unreachable, in seconds.
[timeout]
telemetry_seconds = 5
history_seconds = 15
routeros_seconds = 2
reconnect_seconds = 2
# Silence on the events socket that counts as a dead connection. The server
# pushes stats every ~2 s, so this is ~15 missed pushes.
events_idle_seconds = 30

[ui]
feed_rows = 200
# Samples kept — 24 h at the appliance's 60 s perf cadence. A memory bound: the
# series arrives undecimated and the chart reduces it to the terminal's width.
rss_points = 1440
redraw_millis = 250
# Where the RSS graph changes colour. Applied per column, so the chart shows
# when memory crossed a threshold, not only where it sits now.
rss_warn_mb = 60
rss_alert_mb = 100
slow_query_ms = 50.0

# Read-only. Omit base_url to drop the router figures from the footer.
[routeros]
base_url = "https://PASTE-ROUTER-ADDRESS:8443/rest"
user = "PASTE-ROUTEROS-USER"
# password = "…"   # falls back to $MP
container = "fastadhunter"
# Label clients the appliance has no name for by asking the router who owns the
# address. The only way to name an IPv6 client: the appliance sees dst-natted
# traffic, so the source MAC reaching it is the router's, never the client's.
auto_name = true
