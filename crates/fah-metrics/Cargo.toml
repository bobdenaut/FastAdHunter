[package]
name = "fah-metrics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# fah-model for the QueryEvent DTO the DNS pipeline emits (siblings never
# import each other, ARCHITECTURE.md §Dependency Layering: fah-dns/fah-rules
# hand this crate plain snapshot DTOs of their own counters via the binary,
# not their own types). arc-swap: lock-free swap for the infrequently-updated
# upstream/ruleset snapshots, mirroring fah-rules::ListManager's matcher swap.
# No tokio: the binary's fan-out task calls `Metrics::record` directly; this
# crate spawns nothing.
[dependencies]
arc-swap = { workspace = true }
fah-model = { path = "../fah-model" }

[dev-dependencies]
criterion = { workspace = true }

# Hot-path instrumentation-cost bench (p1-08 acceptance: single-digit ns/event).
[[bench]]
name = "record"
harness = false
