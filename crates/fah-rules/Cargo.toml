[package]
name = "fah-rules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# Parsing is pure string -> structured rules, no I/O. The compiled matcher
# (p1-02) needs fah-model for the shared Verdict / DecisiveRule DTOs. List
# lifecycle (p1-03) needs fah-config for RulesConfig — an L2->L1 edge,
# enforced by the layering guard test.
[dependencies]
arc-swap = { workspace = true }
fah-common = { path = "../fah-common" }
fah-config = { path = "../fah-config" }
fah-model = { path = "../fah-model" }
reqwest = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# Test-only: `tests/dedup_alloc_bound.rs` wraps the production allocator in a
# counting `GlobalAlloc` so the transient dedup index's peak is observable.
# Deliberately not a normal dependency — this crate must not participate in
# allocator selection (that is the binary's, per `crates/fastadhunter/src/allocator.rs`), and a library has no
# business carrying a C-toolchain build requirement.
mimalloc = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "test-util"] }

# Compiled-matcher benches vs PERFORMANCE.md budgets (p1-02). harness=false: the
# criterion runner replaces libtest so `cargo bench` drives it.
[[bench]]
name = "matcher"
harness = false

# Lookup on two overlapping lists — what deduplication does to the slot table
# and its probe chains, not just to resident bytes (p1.5-05).
[[bench]]
name = "overlap_lookup"
harness = false
