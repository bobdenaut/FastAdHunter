[package]
name = "fastadhunter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "fastadhunter"
path = "src/main.rs"

# The binary is the only crate that may see every other one — it is what
# wires the L3 siblings together (ARCHITECTURE.md §Dependency Layering:
# "the binary wires them via channels and handles"), including implementing
# fah-api's port traits over fah-stats and fah-metrics.
[dependencies]
fah-api = { path = "../fah-api" }
fah-common = { path = "../fah-common" }
fah-config = { path = "../fah-config" }
fah-dns = { path = "../fah-dns" }
fah-http = { path = "../fah-http" }
fah-logging = { path = "../fah-logging" }
fah-metrics = { path = "../fah-metrics" }
fah-model = { path = "../fah-model" }
fah-rules = { path = "../fah-rules" }
fah-stats = { path = "../fah-stats" }
# The `--healthcheck` DNS probe encodes one opcode-STATUS query itself: the
# probe runs before the Tokio runtime and must not construct the engine, so
# it cannot borrow fah-dns' encoder. Already in-tree via fah-dns, so this
# links no new code into the binary.
hickory-proto.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The process allocator and its statistics (see `crates/fastadhunter/src/allocator.rs`). Confined to
# `src/allocator.rs`: the binary chooses the allocator, so no library crate
# needs to know which one it is — they see `fah_model::AllocatorStats`.
mimalloc.workspace = true
libmimalloc-sys.workspace = true

# Credential syscalls for the post-bind privilege drop (ADR-0004). Unix only:
# the shipped artefact is a Linux container, and the module compiles to no-ops
# elsewhere so the workspace still builds on a Windows development machine.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
# The end-to-end test speaks to the appliance's self-signed certificate;
# tungstenite needs an explicit rustls config to accept it.
rustls = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
toml.workspace = true

# Whole-product budgets from PERFORMANCE.md that no single crate can answer —
# blocked-query latency, forward-path overhead, sustained throughput, startup
# from cached lists, steady-state memory (p1-10).
# harness=false: the criterion runner replaces libtest so `cargo bench` drives it.
[[bench]]
name = "pipeline"
harness = false
