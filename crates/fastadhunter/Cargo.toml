[package]
name = "fastadhunter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "fastadhunter"
path = "src/main.rs"

# Only the crates the binary actually wires today. The remaining crates
# (fah-dns, fah-api, fah-stats, fah-metrics, fah-rules) get added as their
# wiring lands in later phases; the layering guard test keeps edges downward.
[dependencies]
fah-config = { path = "../fah-config" }
fah-logging = { path = "../fah-logging" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
fah-model = { path = "../fah-model" }
tempfile = "3"
toml.workspace = true
