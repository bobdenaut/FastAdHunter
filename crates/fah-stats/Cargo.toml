[package]
name = "fah-stats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# Aggregates/history/client registry: pure state + `/data` persistence, no
# network. fah-model for the QueryEvent DTO the DNS pipeline emits;
# fah-config for [stats]/[history].
[dependencies]
fah-common = { path = "../fah-common" }
fah-config = { path = "../fah-config" }
fah-model = { path = "../fah-model" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["fs", "io-util", "sync", "time", "macros", "rt-multi-thread", "test-util"] }

# `Stats::record` runs once per completed query in the binary's fan-out
# consumer. Nothing measured it until now, so a regression on that path shipped
# silently.
[[bench]]
name = "record"
harness = false
