[package]
name = "fah-stats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# Aggregates/query log/client registry: pure state + `/data` persistence, no
# network. fah-model for the QueryEvent DTO the DNS pipeline emits;
# fah-config for [stats]/[query_log].
[dependencies]
fah-config = { path = "../fah-config" }
fah-model = { path = "../fah-model" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["fs", "io-util", "sync", "time", "macros", "rt-multi-thread", "test-util"] }
