[package]
name = "fah-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Socket options tokio doesn't expose: `IPV6_V6ONLY` off, so binding `::`
# serves both stacks by our decision rather than the host's sysctl. Only the
# `listen` module needs these; both dependents (fah-rules, fah-api) and every
# engine that uses it already carry tokio, so this costs nothing in the graph.
socket2 = { workspace = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "macros", "rt-multi-thread"] }
criterion = { workspace = true }

# Session-validity control for cross-checkout A/B benchmarking. Uses no item
# from this crate and no other workspace crate, so no project change can move
# it: a delta here means the box, not the code (PERFORMANCE.md §Measuring
# reliably). Every bench-hosting crate transitively links `fah-model`, so
# before this target the workspace had no null control.
[[bench]]
name = "session_control"
harness = false
