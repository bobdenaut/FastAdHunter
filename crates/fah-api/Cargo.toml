[package]
name = "fah-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# L3 sibling: serves the whole API.md surface over axum+rustls (SECURITY.md:
# HTTPS by default, bearer-key auth). Certificate machinery lives in fah-certs
# (L2, ADR-0006); this crate keeps only the local-address probe. Depends
# downward only: fah-certs/fah-rules (L2) and fah-config/fah-model (L1) are
# held directly; fah-stats/fah-metrics/fah-dns data arrives through this crate's own port
# traits (`StatsSource`, `TelemetrySource`), implemented in `fastadhunter` —
# ARCHITECTURE.md rule 2: siblings never import each other, the binary wires
# them via channels and handles (same pattern as fah-metrics' snapshot DTOs).
[features]
# Relaxed rate-limiter and known-password `AuthState` constructors for the
# integration harnesses and the p5-04 measurement legs. Non-default and never
# enabled by `cargo build --release`; `resolver = "2"` keeps dev-dependency
# features out of normal builds, so the shipped binary cannot carry them.
test-harness = []

[dependencies]
fah-certs = { path = "../fah-certs" }
fah-common = { path = "../fah-common" }
fah-config = { path = "../fah-config" }
fah-model = { path = "../fah-model" }
fah-rules = { path = "../fah-rules" }

arc-swap = { workspace = true }
# Argon2id for the dashboard password (SECURITY.md's crypto set). The only new
# runtime crate this task adds.
argon2 = "0.5"
# HMAC-SHA256 over the session token, plus its constant-time `verify`. Already
# compiled into this crate through rustls and fah-certs, so
# this is a manifest edge rather than a new crate — Rust has no transitive
# visibility, and the name has to be declared here to be callable.
aws-lc-rs = "1.17"
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "service", "tokio"] }
rand = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { version = "0.3", default-features = false, features = ["formatting", "parsing", "std"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tower = { version = "0.5", features = ["util"] }
# `fs` is the dashboard's static surface (ServeDir/ServeFile, pre-compressed
# variants, Last-Modified revalidation); `set-header` adds the cache-control and
# Vary layers over it. Already in Cargo.lock through reqwest, but only as a
# dev-dependency and without `fs`, so this is a genuine release-binary addition
# — the delta is recorded in docs/code-review/phase5/p5-01-static-serving-review.md.
tower-http = { version = "0.6", default-features = false, features = ["fs", "set-header"] }
tracing = { workspace = true }

[dev-dependencies]
# Self dev-dependency: the only way to turn `test-harness` on for this crate's
# own integration tests without it reaching a release build (D4-a).
fah-api = { path = ".", features = ["test-harness"] }
reqwest = { workspace = true, features = ["json", "blocking"] }
tempfile = "3"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["rustls-tls-webpki-roots"] }
futures-channel = { version = "0.3", default-features = false, features = ["std", "sink"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
