[package]
name = "fah-dns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# L2 certificate machinery for the DoT listener (p3-05): the SNI-minting
# resolver and the leaf cache it pre-warms on a handshake miss (ADR-0006).
fah-certs = { path = "../fah-certs" }
fah-common = { path = "../fah-common" }
fah-config = { path = "../fah-config" }
fah-model = { path = "../fah-model" }
fah-rules = { path = "../fah-rules" }
hickory-net = { workspace = true }
hickory-proto = { workspace = true }
rand = { workspace = true }
# `aws_lc_rs` declared because `dot.rs` names the provider directly, exactly
# as fah-certs and fah-http do — one provider across the workspace.
rustls = { workspace = true, features = ["aws_lc_rs"] }
tokio = { workspace = true, features = ["io-util", "net", "rt", "sync", "time"] }
# DoT/853 acceptor (RFC 7858). Pinned like fah-api's so the workspace links
# one crypto provider.
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
mimalloc = { workspace = true }
rcgen = "0.14"
tempfile = "3"
tokio = { workspace = true, features = ["io-util", "net", "sync", "time", "test-util", "macros", "rt-multi-thread"] }
x509-parser = "0.18"

# Cache-hit in-engine latency vs PERFORMANCE.md's <1ms budget (p1-05).
# harness=false: the criterion runner replaces libtest so `cargo bench` drives it.
[[bench]]
name = "cache"
harness = false

# Upstream attempt path: the outer per-attempt timeout (p2.5-07 U2) must be
# free on an answered or fast-failing forward.
[[bench]]
name = "upstream"
harness = false

# Stage 1 selector and state-update cost (p2.6-08 S1-M): pure functions over a
# synthetic health slice, no sockets, no runtime. Pinned to one core, except
# transition/claim_probe which needs four.
[[bench]]
name = "upstream_select"
harness = false
