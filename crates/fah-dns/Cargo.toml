[package]
name = "fah-dns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
fah-common = { path = "../fah-common" }
fah-config = { path = "../fah-config" }
fah-model = { path = "../fah-model" }
fah-rules = { path = "../fah-rules" }
hickory-net = { workspace = true }
hickory-proto = { workspace = true }
rand = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
rcgen = "0.14"
tempfile = "3"
tokio = { workspace = true, features = ["io-util", "net", "sync", "time", "test-util", "macros", "rt-multi-thread"] }
tokio-rustls = "0.26"

# Cache-hit in-engine latency vs PERFORMANCE.md's <1ms budget (p1-05).
# harness=false: the criterion runner replaces libtest so `cargo bench` drives it.
[[bench]]
name = "cache"
harness = false
