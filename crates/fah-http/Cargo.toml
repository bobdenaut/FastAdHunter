[package]
name = "fah-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# L3 (ARCHITECTURE.md §Dependency Layering): may depend on fah-rules (L2) and
# L1 only, never on fah-dns / fah-api / fah-stats / fah-metrics — the binary
# wires the siblings together. `fah-rules` and `fah-model` arrive with p2-04,
# which is when verdicts are actually consulted and events actually emitted.
[dependencies]
# `fah-certs` (L2) supplies the minted leaf and the `MintingResolver` the
# interception leg (p3-04) hands to rustls; the crate never mints or caches.
fah-certs = { path = "../fah-certs" }
fah-common = { path = "../fah-common" }
fah-config = { path = "../fah-config" }
fah-model = { path = "../fah-model" }
fah-rules = { path = "../fah-rules" }

bytes = "1"
http-body-util = "0.1"
# `http2` because an intercepted client may negotiate h2 on either side; the
# plaintext proxy stays h1-only.
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
# `client-legacy` is hyper-util's pooling client — the connection reuse the
# proxy needs upstream. Already in-tree via fah-api, so this adds no new crate.
# `server-auto` is the h1/h2 sniffing server the interception leg serves the
# decrypted stream with — the same feature set fah-api already builds.
hyper-util = { version = "0.1", features = [
    "client",
    "client-legacy",
    "http1",
    "http2",
    "server",
    "server-auto",
    "tokio",
] }
# Pinned exactly as fah-api and fah-certs pin it: one TLS backend
# (SECURITY.md), aws-lc-rs, no ring.
rustls = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
# The connector is a `tower_service::Service<Uri>`; the one trait, not the
# whole tower stack.
tower-service = "0.3"
tracing = { workspace = true }
# Upstream verification roots. The distroless image has no system store, so
# the bundle ships compiled in — the same reason hickory-net carries it.
webpki-roots = "1"

[dev-dependencies]
tokio = { workspace = true, features = [
    "io-util",
    "net",
    "sync",
    "time",
    "macros",
    "rt-multi-thread",
] }
criterion = { workspace = true }
http-body-util = "0.1"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
tempfile = "3"
# Example-only (`examples/httpbench.rs`, the on-device probe): the probe has to
# run the allocator the router runs, or its figures describe a build production
# never ships. A library must not participate in allocator selection — that is
# the binary's job (`crates/fastadhunter/src/allocator.rs`) — and an example
# imposes nothing on dependents.
mimalloc = { workspace = true }

# harness=false: the criterion runner replaces libtest so `cargo bench` drives it.
[[bench]]
name = "proxy"
harness = false
