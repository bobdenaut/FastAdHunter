[workspace]
resolver = "2"
members = ["crates/*", "tui-monitor"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.96"
publish = false

[workspace.dependencies]
# default-features off drops plotters/rayon: fewer transitive deps, faster
# builds, and it keeps `cargo bench` buildable offline (PERFORMANCE.md benches).
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# arc-swap: lock-free atomic swap of the compiled ruleset (RULE_ENGINE.md
# §List lifecycle, ARCHITECTURE.md §Runtime Model) — readers never lock.
arc-swap = "1.9"
# SIMD byte search for the URL matcher's unanchored scan (SSE2/AVX2 on x86_64,
# NEON on aarch64). Not regex — a single-byte `memchr`, which is the one
# primitive PERFORMANCE.md's "no regex on the hot path" rule leaves open and
# which the scalar loop it replaces was costing ~3 us per candidate rule on an
# 8 KiB URL. Zero dependencies, and already in the tree transitively.
memchr = { version = "2.8", default-features = false, features = ["std"] }
# default-features off drops native-tls/openssl; "rustls" is this project's
# only TLS backend (SECURITY.md: rustls/rcgen/x509-parser, no other crypto).
#
# "hickory-dns" replaces the default `getaddrinfo` resolver with the pure-Rust
# one. Not a preference: the binary is statically linked against musl, whose
# `getaddrinfo` issues the A and AAAA queries together and fails the *entire*
# lookup with EAI_AGAIN when either goes unanswered, instead of returning the
# family that did resolve. On the RB5009 that silently left the ruleset empty
# while the resolver itself kept serving traffic. It reuses the hickory-proto
# already in-tree for the DNS upstreams, so this costs one crate, not a stack.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "hickory-dns",
] }
# DNS wire format only (ARCHITECTURE.md: "hickory-proto; fah-model holds our
# own domain types only"). No dnssec-* feature: Phase 1 is pass-through, not
# validation (ARCHITECTURE.md §Listeners).
hickory-proto = "0.26"
# DoT/DoH upstream clients (ARCHITECTURE.md §Upstreams: Hickory + rustls).
# aws-lc-rs matches the rustls provider already in-tree via reqwest, so the
# workspace carries one crypto backend; webpki-roots because the distroless
# image has no system certificate store.
hickory-net = { version = "0.26", default-features = false, features = ["tokio", "https-aws-lc-rs", "webpki-roots"] }
# Process allocator (see `crates/fastadhunter/src/allocator.rs`). The shipped artefact is statically linked
# against musl, so the allocator it would otherwise use is musl's mallocng —
# written for size and hardening, with no per-thread cache, which is what a
# Tokio runtime allocating per query is worst served by.
#
# Named ONLY in crates/fastadhunter/src/allocator.rs (plus fah-rules' counting
# allocator test), so replacing it later means editing one file.
#
# Two entries: the `mimalloc` wrapper does not re-export the FFI, so
# `mi_process_info` — the allocator figures behind /debug/memory —
# is reachable only through the -sys crate with `extended` (which pulls `cty`).
# Feature unification resolves it to the same instance `mimalloc` already pulls,
# so mimalloc's C compiles once.
#
# Patch-pinned on purpose: "0.1" silently selects a C library *major* version —
# libmimalloc-sys 0.1.49 defaults to mimalloc v3 (3.3.2) and offers v2 (2.3.2)
# behind a `v2` feature. See `crates/fastadhunter/src/allocator.rs` for what symptom would justify switching.
mimalloc = "0.1.52"
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
# Socket options tokio doesn't expose: the dual-stack DNS listener sets
# IPV6_V6ONLY off explicitly so binding `::` serves both stacks regardless
# of the host's `net.ipv6.bindv6only`. Already in-tree transitively (tokio,
# hyper); this only makes it a direct dependency.
socket2 = "0.6"
rand = "0.9"
rustls = "0.23"
url = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "registry"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# PERFORMANCE.md: container image size budget is <= 30MB.
[profile.release]
strip = true
lto = true
codegen-units = 1
