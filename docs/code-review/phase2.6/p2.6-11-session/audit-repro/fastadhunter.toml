[engine]
mode = "dns+http"

[dns.listen]
address = "::"
port = 53

[dns.blocking]
mode = "null_ip"
ttl_seconds = 10

[dns.cache]
max_entries = 50000
max_bytes = 67108864
min_ttl_seconds = 600
max_ttl_seconds = 86400
negative_ttl_max_seconds = 60
serve_stale = true
swr_workers = 3
cleanup_interval_seconds = 360

[dns.upstreams]
strategy = "adaptive"
timeout_ms = 800
penalty_failures = 2

[[dns.upstreams.servers]]
address = "172.30.0.10:5301"
protocol = "udp"

[[dns.upstreams.servers]]
address = "172.30.0.10:5302"
protocol = "udp"

[[dns.upstreams.servers]]
address = "172.30.0.10:5303"
protocol = "udp"

[[dns.upstreams.servers]]
address = "172.30.0.10:5304"
protocol = "udp"

[http.listen]
address = "::"
port = 8080

[stats]
snapshot_interval_seconds = 300

[history]
enabled = true
sample_interval_seconds = 360
retention_days = 30

[api]
address = "0.0.0.0"
port = 8443
tls = true

[log]
level = "info"
format = "text"

[rules]
refresh_hours_default = 48

[[rules.lists]]
id = "big.oisd.nl"
url = "https://big.oisd.nl"
refresh_hours = 48

