[engine]
mode = "dns+http+https"

[runtime]
http_runtimes = 2

[dns]
tcp_max_connections = 1024
udp_max_inflight = 0

[dns.listen]
address = "::"
port = 53
dot_enabled = true
dot_port = 853
doh_enabled = true

[dns.blocking]
mode = "null_ip"
ttl_seconds = 10

[dns.cache]
max_entries = 50000
max_bytes = 67108864
min_ttl_seconds = 600
max_ttl_seconds = 86400
negative_ttl_max_seconds = 60
serve_stale = true
swr_workers = 3
cleanup_interval_seconds = 360

[dns.upstreams]
strategy = "adaptive"
timeout_ms = 800
penalty_failures = 2

[[dns.upstreams.servers]]
address = "1.1.1.1"
protocol = "udp"

[[dns.upstreams.servers]]
address = "9.9.9.9"
protocol = "udp"

[[dns.upstreams.servers]]
address = "2606:4700:4700::1111"
protocol = "udp"

[[dns.upstreams.servers]]
address = "2620:fe::fe"
protocol = "udp"

[http]
max_connections = 1024
idle_timeout_ms = 60000
header_timeout_ms = 10000

[http.listen]
address = "::"
port = 8080

[https]
max_connections = 1024
hello_timeout_ms = 10000
idle_timeout_ms = 60000

[https.listen]
address = "::"
port = 8444

[https.sni]
no_sni = "pass"

[egress]
allow_destinations = []
allow_ip_literal_hosts = false

[rules]
refresh_hours_default = 48

[[rules.lists]]
id = "big.oisd.nl"
url = "https://big.oisd.nl"
enabled = true
refresh_hours = 48

