<!DOCTYPE html>

<title>FastAdHunter — Architecture</title>
<style>

  .sheet { max-width: 980px; margin: 0 auto; background: #ffffff; border-radius: 12px;
           box-shadow: 0 4px 24px rgba(15, 23, 42, .15); padding: 16px; }

</style>
</head>
<body>
<div class="sheet">

  <text x="340" y="370" text-anchor="middle" font-size="10.5" fill="#92400e">allow &gt; block · atomic swap · no locks</text>

  <line x1="340" y1="378" x2="340" y2="408" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="397" text-anchor="start" font-size="10.5" fill="#475569">allow / pass</text>

  <text x="340" y="458" text-anchor="middle" font-size="10.5" fill="#166534">hit → reply</text>

  <line x1="340" y1="466" x2="340" y2="498" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="486" text-anchor="start" font-size="10.5" fill="#475569">miss</text>

  <text x="695" y="556" text-anchor="middle" font-size="10.5" fill="#334155">TOML · env · API write-back · atomic swap</text>

  <!-- Volumes -->
  <text x="695" y="610" text-anchor="middle" font-size="11" fill="#64748b">persistent volumes — external SSD</text>
  <rect x="560" y="620" width="125" height="52" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="622" y="641" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">/config</text>
  <text x="622" y="658" text-anchor="middle" font-size="10" fill="#475569">toml · key · certs</text>
  <rect x="705" y="620" width="125" height="52" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="767" y="641" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">/data</text>
  <text x="767" y="658" text-anchor="middle" font-size="10" fill="#475569">lists · log · snapshots</text>

  <line x1="560" y1="272" x2="474" y2="336" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowPurple)"/>

  <text x="255" y="778" text-anchor="middle" font-size="12" fill="#1e293b">1.1.1.1 · Cloudflare</text>
  <rect x="355" y="752" width="140" height="44" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="425" y="778" text-anchor="middle" font-size="12" fill="#1e293b">9.9.9.9 · Quad9</text>
  <text x="515" y="780" text-anchor="start" font-size="10.5" fill="#64748b">plain UDP default · DoT / DoH opt-in · TCP fallback</text>

  <line x1="255" y1="796" x2="310" y2="834" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="425" y1="796" x2="370" y2="834" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="340" y="863" text-anchor="middle" font-size="13" font-weight="600" fill="#075985">Internet</text>

  <text x="470" y="915" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Crate layers — dependencies point downward only</text>

  <rect x="320" y="935" width="300" height="36" rx="8" fill="#334155" stroke="#0f172a" stroke-width="1.5"/>
  <text x="470" y="958" text-anchor="middle" font-size="11.5" fill="#f8fafc">fastadhunter — binary, wires siblings via channels</text>

  <text x="334" y="1013" text-anchor="middle" font-size="11.5" fill="#166534">fah-http</text>
  <rect x="412" y="990" width="116" height="36" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="470" y="1013" text-anchor="middle" font-size="11.5" fill="#5b21b6">fah-api</text>
  <rect x="548" y="990" width="116" height="36" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="606" y="1013" text-anchor="middle" font-size="11.5" fill="#115e59">fah-stats</text>
  <rect x="684" y="990" width="116" height="36" rx="8" fill="#cffafe" stroke="#0e7490" stroke-width="1.5"/>

  <text x="125" y="1013" text-anchor="end" font-size="11" fill="#94a3b8">L3</text>
  <line x1="470" y1="1026" x2="470" y2="1043" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="320" y="1045" width="300" height="36" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>

  <line x1="470" y1="1081" x2="470" y2="1098" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="140" y="1100" width="150" height="36" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="215" y="1123" text-anchor="middle" font-size="11.5" fill="#854d0e">fah-model</text>
  <rect x="310" y="1100" width="150" height="36" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="385" y="1123" text-anchor="middle" font-size="11.5" fill="#334155">fah-config</text>
  <rect x="480" y="1100" width="150" height="36" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="555" y="1123" text-anchor="middle" font-size="11.5" fill="#334155">fah-common</text>
  <rect x="650" y="1100" width="150" height="36" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="725" y="1123" text-anchor="middle" font-size="11.5" fill="#334155">fah-logging</text>
  <text x="125" y="1123" text-anchor="end" font-size="11" fill="#94a3b8">L1</text>
